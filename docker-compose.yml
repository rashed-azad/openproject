services:
  postgres:
    image: postgres:17-alpine
    container_name: openproject-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  openproject:
    image: openproject/openproject:17.6.0-slim
    container_name: openproject-app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      OPENPROJECT_HOST_NAME: ${HOST_NAME}
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_FORCE_SSL: "false"
      # Community Edition appearance
      OPENPROJECT_EDITION: "standard"
      # Hide Enterprise UI where possible
      OPENPROJECT_EE__HIDE__BANNERS: "true"
      OPENPROJECT_EE__MANAGER__VISIBLE: "false"
      # Hide community links
      OPENPROJECT_SHOW__COMMUNITY__LINKS: "false"
      OPENPROJECT_DISABLED__MODULES: "team_planner_view"
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - openproject_data:/var/openproject/assets
    restart: always

volumes:
  postgres_data:
  openproject_data: